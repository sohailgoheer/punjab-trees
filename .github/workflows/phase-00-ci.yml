name: Phase 00 foundation and security checks

# Retest after the real PHP 8.4.27 Composer lockfile was committed.

on:
  push:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/phase-00-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/phase-00-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: React foundation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Node smoke tests
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build

  backend:
    name: Patched PHP 8.4 / Laravel 13
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, curl, fileinfo, pdo_mysql, openssl
          tools: composer:v2
      - name: Fail closed on unpatched CLI PHP
        run: |
          php -v
          php scripts/check-php-runtime.php
      - name: Validate Composer manifest and locked dependencies
        run: composer validate --no-check-publish --strict
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Security advisory scan (required)
        run: composer audit --no-interaction
      - name: PHP syntax and security policy
        run: |
          php -l artisan
          php -l bootstrap/app.php
          php -l app/Support/PhpRuntimePolicy.php
          php -l scripts/check-php-runtime.php
          php -l routes/api.php
          php -l public/index.php
          php -l tests/Unit/PhpRuntimePolicyTest.php
      - name: Prepare isolated temporary CI configuration
        run: |
          cp .env.example .env
          php artisan key:generate --force --no-interaction
      - name: API route smoke check
        run: php artisan route:list --path=api
      - name: Laravel tests
        run: php artisan test --display-warnings
      - name: Strict PHPUnit gate (warnings/deprecations fail the build)
        run: ./vendor/bin/phpunit --display-warnings --fail-on-warning --fail-on-deprecation
      - name: HTTP smoke check on CI web SAPI (NOT cPanel proof)
        run: |
          php artisan serve --host=127.0.0.1 --port=8013 >/tmp/treestory-serve.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 2 -H 'Accept: application/json' http://127.0.0.1:8013/api/v1/health | grep -q '"status":"ok"'; then
              echo 'HTTP smoke PASS (GitHub runner only; host web SAPI still unverified)'
              exit 0
            fi
            sleep 1
          done
          echo 'HTTP smoke FAILED'
          cat /tmp/treestory-serve.log
          exit 1
