name: Pin Phase 00 dependency locks

# One-time guarded automation: generates real npm/Composer lockfiles using
# registry resolution. The PHP baseline blocks insecure runtimes and audits
# before a lockfile may be committed.
on:
  push:
    paths:
      - '.github/workflows/pin-dependencies.yml'
      - 'backend/composer.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-lockfiles:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate npm lockfile from registry
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, curl, fileinfo, pdo_mysql, openssl
          tools: composer:v2
      - name: Fail closed on unpatched PHP before dependency resolution
        working-directory: backend
        run: php scripts/check-php-runtime.php
      - name: Resolve Laravel 13 dependencies for patched PHP 8.4
        working-directory: backend
        run: composer update --no-install --no-scripts --no-interaction --prefer-dist --no-progress
      - name: Composer security advisory scan (required)
        working-directory: backend
        run: composer audit --locked --no-interaction
      - name: Check generated locks
        run: |
          test -s frontend/package-lock.json
          test -s backend/composer.lock
          node -e "const p=require('./frontend/package-lock.json'); if(p.name!=='treestory-web') process.exit(1)"
          cd backend && composer validate --no-check-publish --strict && cd ..
      - name: Commit ONLY the generated lockfiles
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- frontend/package-lock.json backend/composer.lock
          if ! git diff --cached --quiet; then
            git commit -m 'security: lock patched PHP 8.4 Laravel 13 dependency graph'
            git push origin HEAD:main
          fi
